{% assign share_on_label = site.data.ui-text[site.locale].share_on_label | default: "Share on" %}
{% capture share_text %}{{ page.title }} {{ page.url | absolute_url }}{% endcapture %}

<section class="page__share" data-share-title="{{ page.title | escape }}">
  <h4 class="page__share-title">{{ share_on_label }}</h4>

  <div class="page__share-buttons">
    <a href="mailto:?subject={{ page.title | url_encode }}&amp;body={{ share_text | strip | url_encode }}" class="btn btn--primary" data-share-service="email" aria-label="Share by email" title="Share by email">
      <i class="fas fa-fw fa-envelope" aria-hidden="true"></i>
    </a>

    <a href="https://bsky.app/intent/compose?text={{ share_text | strip | url_encode }}" class="btn btn--bluesky" data-share-service="bluesky" target="_blank" rel="noopener noreferrer" aria-label="Share on Bluesky" title="Share on Bluesky">
      <svg class="page__share-icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M111.8 62.2C170.2 105.9 233 194.7 256 242.4c23-47.6 85.8-136.4 144.2-180.2c42.1-31.6 110.3-56 110.3 21.8c0 15.5-8.9 130.5-14.1 149.2C478.2 298 412 314.6 353.1 304.5c102.9 17.5 129.1 75.5 72.5 133.5c-107.4 110.2-154.3-27.6-166.3-62.9l0 0c-1.7-4.9-2.6-7.8-3.3-7.8s-1.6 3-3.3 7.8l0 0c-12 35.3-59 173.1-166.3 62.9c-56.5-58-30.4-116 72.5-133.5C100 314.6 33.8 298 15.7 233.1C10.4 214.4 1.5 99.4 1.5 83.9c0-77.8 68.2-53.4 110.3-21.8z"/></svg>
    </a>

    <button type="button" class="btn btn--mastodon" data-share-mastodon aria-label="Share on Mastodon" title="Share on Mastodon">
      <i class="fab fa-fw fa-mastodon" aria-hidden="true"></i>
    </button>

    <a href="https://www.reddit.com/submit?url={{ page.url | absolute_url | url_encode }}&amp;title={{ page.title | url_encode }}" class="btn btn--reddit" data-share-service="reddit" target="_blank" rel="noopener noreferrer" aria-label="Share on Reddit" title="Share on Reddit">
      <i class="fab fa-fw fa-reddit" aria-hidden="true"></i>
    </a>

    <a href="https://www.tumblr.com/widgets/share/tool?canonicalUrl={{ page.url | absolute_url | url_encode }}&amp;title={{ page.title | url_encode }}" class="btn btn--tumblr" data-share-service="tumblr" target="_blank" rel="noopener noreferrer" aria-label="Share on Tumblr" title="Share on Tumblr">
      <i class="fab fa-fw fa-tumblr" aria-hidden="true"></i>
    </a>

    <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" class="btn btn--facebook" data-share-service="facebook" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook" title="Share on Facebook">
      <i class="fab fa-fw fa-facebook" aria-hidden="true"></i>
    </a>

    <a href="https://twitter.com/intent/tweet?text={{ share_text | strip | url_encode }}" class="btn btn--x-twitter" data-share-service="x" target="_blank" rel="noopener noreferrer" aria-label="Share on X or Twitter" title="Share on X or Twitter">
      <i class="fab fa-fw fa-twitter" aria-hidden="true"></i>
    </a>
  </div>
</section>

<script>
(function () {
  var section = document.currentScript.previousElementSibling;
  if (!section || !section.classList.contains("page__share")) return;

  var title = section.getAttribute("data-share-title") || document.title;
  var url = window.location.href.split("#")[0];
  var text = title + " " + url;
  var encodedTitle = encodeURIComponent(title);
  var encodedUrl = encodeURIComponent(url);
  var encodedText = encodeURIComponent(text);
  var serviceUrls = {
    bluesky: "https://bsky.app/intent/compose?text=" + encodedText,
    reddit: "https://www.reddit.com/submit?url=" + encodedUrl + "&title=" + encodedTitle,
    tumblr: "https://www.tumblr.com/widgets/share/tool?canonicalUrl=" + encodedUrl + "&title=" + encodedTitle,
    facebook: "https://www.facebook.com/sharer/sharer.php?u=" + encodedUrl,
    email: "mailto:?subject=" + encodedTitle + "&body=" + encodedText,
    x: "https://twitter.com/intent/tweet?text=" + encodedText
  };

  section.querySelectorAll("[data-share-service]").forEach(function (link) {
    link.href = serviceUrls[link.getAttribute("data-share-service")];
  });

  var userAgentData = navigator.userAgentData;
  var isMobileDevice = userAgentData && typeof userAgentData.mobile === "boolean"
    ? userAgentData.mobile
    : /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

  if (navigator.share && isMobileDevice) {
    var nativeButton = document.createElement("button");
    nativeButton.type = "button";
    nativeButton.className = "btn btn--primary page__share-native is-supported";
    nativeButton.setAttribute("data-share-native", "");
    nativeButton.setAttribute("aria-label", "Share this post");
    nativeButton.setAttribute("title", "Share this post");
    nativeButton.innerHTML = '<i class="fas fa-fw fa-share-alt" aria-hidden="true"></i>';

    var emailButton = section.querySelector('[data-share-service="email"]');
    emailButton.insertAdjacentElement("afterend", nativeButton);
    nativeButton.addEventListener("click", function () {
      navigator.share({title: title, url: url}).catch(function (error) {
        if (error.name !== "AbortError") console.error(error);
      });
    });
  }

  var mastodonButton = section.querySelector("[data-share-mastodon]");
  if (mastodonButton) {
    mastodonButton.addEventListener("click", function () {
      var instance = window.prompt("Enter your Mastodon instance (for example, mastodon.social):");
      if (!instance) return;
      try {
        var instanceUrl = new URL(/^https?:\/\//i.test(instance) ? instance : "https://" + instance);
        var shareUrl = instanceUrl.origin + "/share?text=" + encodedText;
        window.open(shareUrl, "_blank", "noopener,noreferrer");
      } catch (error) {
        window.alert("That Mastodon instance is not valid.");
      }
    });
  }
})();
</script>
